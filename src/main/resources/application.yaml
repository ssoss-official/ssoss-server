spring:
  application:
    name: ssoss-backend
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  task:
    execution:
      thread-name-prefix: async-
      simple:
        concurrency-limit: 100
      shutdown:
        await-termination: true
        await-termination-period: 60s
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:local-only-gemini-api-key}
        chat:
          model: gemini-3.1-flash-lite
logging:
  level:
    org.zalando.logbook: TRACE
logbook:
  format:
    style: http
  write:
    max-body-size: 2000
  predicate:
    exclude:
      - path: /scalar
      - path: /scalar/**
      - path: /v3/api-docs
      - path: /v3/api-docs/**
      - path: /favicon.ico
      - path: /favicon.svg
scalar:
  enabled: true
  path: /scalar
auth:
  access-ttl: 30m
  refresh-ttl: 14d
  jwt:
    secret: local-only-secret-key-at-least-256-bits-long!!!!
  oauth:
    naver:
      profile-url: https://openapi.naver.com/v1/nid/me
      revoke-url: https://nid.naver.com/oauth2.0/revoke
      client-id: ${NAVER_CLIENT_ID:local-only-naver-client-id}
      client-secret: ${NAVER_CLIENT_SECRET:local-only-naver-client-secret}
      connect-timeout: 3s
      read-timeout: 5s
    apple:
      jwks-url: https://appleid.apple.com/auth/keys
      token-url: https://appleid.apple.com/auth/token
      revoke-url: https://appleid.apple.com/auth/revoke
      client-id: ${APPLE_CLIENT_ID:local-only-apple-client-id}
      team-id: ${APPLE_TEAM_ID:local-only-team-id}
      key-id: ${APPLE_KEY_ID:local-only-key-id}
      private-key: ${APPLE_PRIVATE_KEY:}
      connect-timeout: 3s
      read-timeout: 5s

credit:
  free-grant: 100

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/mydatabase
    username: myuser
    password: secret

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
  oauth:
    apple:
      client-id: ${APPLE_CLIENT_ID}
      team-id: ${APPLE_TEAM_ID}
      key-id: ${APPLE_KEY_ID}
      private-key: ${APPLE_PRIVATE_KEY}
    naver:
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}
